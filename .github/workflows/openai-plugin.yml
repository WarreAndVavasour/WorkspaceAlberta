name: OpenAI plugin verification

on:
  push:
    branches: [main, openai/corporate-plugin-delivery]
  pull_request:
    paths:
      - 'plugins/workspacealberta/**'
      - 'scripts/openai_plugin.py'
      - 'procurement_core/**'
      - 'mcp-servers/canadabuys/**'
      - 'tests/test_openai*.py'
      - '.github/workflows/openai-plugin.yml'
  workflow_run:
    workflows: ['Deploy to Cloud Run']
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: openai-plugin-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    if: github.event_name != 'workflow_run' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_repository.full_name == github.repository)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CANADABUYS_LOAD_ENV_FILE: '0'
      WA_OAUTH_STORE: memory
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          ref: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Install server dependencies
        run: python -m pip install -q -r requirements.txt -r mcp-servers/canadabuys/requirements.txt -r tests/requirements.txt
      - name: Verify OpenAI and production regression contracts
        run: |
          mkdir -p output/openai
          python -c 'import mcp'
          set -o pipefail
          python -m unittest \
            tests.test_openai_plugin tests.test_openai_wire tests.test_openai_pipeline \
            tests.test_oauth tests.test_oauth_security tests.test_google_login \
            tests.test_agent_contract tests.test_procurement_http_app \
            tests.test_connector_review tests.test_blog tests.test_e2b_bid_room \
            tests.test_canadabuys_mcp_smoke tests.test_procurement_fixtures \
            tests.test_search_relevance tests.test_query_planner tests.test_apc_workflow \
            tests.test_production_hardening tests.test_telemetry tests.test_gate_and_billing \
            tests.test_cloud_run_release tests.test_apc_documents tests.test_local_bid_room 2>&1 | tee output/openai/tests.txt
      - name: Build plugin and record public endpoint readiness
        run: |
          python scripts/openai_plugin.py build --output output/openai/workspacealberta-openai.zip
          python scripts/openai_plugin.py probe --output output/openai/live-readiness.json
      - name: Record exact source
        if: always()
        run: |
          mkdir -p output/openai
          git rev-parse HEAD > output/openai/source-commit.txt
      - name: Preserve package and read-only readiness evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: openai-plugin-${{ github.run_id }}
          path: output/openai/
          if-no-files-found: warn
          retention-days: 30
