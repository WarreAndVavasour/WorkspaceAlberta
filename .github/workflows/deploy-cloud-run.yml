name: Deploy to Cloud Run

on:
  workflow_dispatch:
    inputs:
      action:
        description: Stage builds and tests main; promote moves a verified revision to production
        type: choice
        options: [stage, promote]
        default: stage
        required: true
      revision:
        description: For promote only — exact revision from the successful stage summary
        type: string
      expected_current:
        description: For promote only — previous production revision from the stage summary
        type: string

permissions:
  contents: read

# Stage and promote share a lock; never cancel a deployment halfway through.
concurrency:
  group: workspacealberta-cloud-run-production
  cancel-in-progress: false

jobs:
  release:
    if: github.ref == 'refs/heads/main' && (github.repository == 'WarreAndVavasour/WorkspaceAlberta' || github.repository == 'HarleyCoops/WorkspaceAlberta')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write
    env:
      CANADABUYS_LOAD_ENV_FILE: '0'
      IMAGE: northamerica-northeast1-docker.pkg.dev/workspacealberta-prod/cloud-run-source-deploy/workspacealberta
      RELEASE_ACTION: ${{ inputs.action }}
      REVISION: ${{ inputs.revision }}
      EXPECTED_CURRENT: ${{ inputs.expected_current }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: python -m pip install -r requirements.txt -r mcp-servers/canadabuys/requirements.txt
      - name: Validate request
        run: |
          if [[ "$RELEASE_ACTION" == promote ]]; then
            test -n "$REVISION" && test -n "$EXPECTED_CURRENT"
          fi
          test -n '${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}'
          test -n '${{ vars.GCP_DEPLOY_SERVICE_ACCOUNT }}'
      - name: Test source before building
        if: inputs.action == 'stage'
        run: |
          python -m unittest \
            tests.test_oauth tests.test_oauth_security tests.test_google_login \
            tests.test_agent_contract tests.test_procurement_http_app \
            tests.test_connector_review tests.test_blog tests.test_e2b_bid_room \
            tests.test_canadabuys_mcp_smoke tests.test_procurement_fixtures \
            tests.test_search_relevance tests.test_query_planner tests.test_apc_workflow \
            tests.test_production_hardening tests.test_telemetry tests.test_gate_and_billing \
            tests.test_cloud_run_release
      - name: Build only tracked application files
        if: inputs.action == 'stage'
        run: |
          context_dir=$(mktemp -d)
          git archive "$GITHUB_SHA" Dockerfile requirements.txt procurement_core mcp-servers/canadabuys | tar -x -C "$context_dir"
          image_tag="$IMAGE:git-$GITHUB_SHA-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          docker build --tag "$image_tag" "$context_dir"
          echo "IMAGE_TAG=$image_tag" >> "$GITHUB_ENV"
      - name: Authenticate with short-lived Google credentials
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3
        with:
          project_id: workspacealberta-prod
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOY_SERVICE_ACCOUNT }}
      - uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db # v3
      - name: Push image and stage at zero production traffic
        if: inputs.action == 'stage'
        run: |
          gcloud auth configure-docker northamerica-northeast1-docker.pkg.dev --quiet
          docker push "$IMAGE_TAG"
          image_digest=$(docker inspect --format='{{index .RepoDigests 0}}' "$IMAGE_TAG")
          python scripts/cloud_run_release.py stage \
            --image "$image_digest" --commit "$GITHUB_SHA" \
            --suffix "git-${GITHUB_SHA:0:12}-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT" \
            --output output/cloud-run/release.json
      - name: Verify and promote the specified revision
        if: inputs.action == 'promote'
        run: |
          python scripts/cloud_run_release.py promote \
            --revision "$REVISION" --expected-current "$EXPECTED_CURRENT" \
            --output output/cloud-run/release.json
      - name: Write release summary
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          report = json.loads(Path('output/cloud-run/release.json').read_text())
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as summary:
              summary.write('## Cloud Run release\n\n')
              for key in ('status', 'revision', 'previous_revision', 'commit', 'image', 'url'):
                  summary.write(f'- **{key}:** `{report[key]}`\n')
              if os.environ['RELEASE_ACTION'] == 'stage':
                  summary.write('\nTo release, run this workflow again on main with **promote**. '
                                'Use `revision` and `previous_revision` above for the two revision inputs.\n')
          PY
      - name: Save public verification evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: cloud-run-${{ inputs.action }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: output/cloud-run/
          if-no-files-found: ignore
          retention-days: 30
