<title>__BOARD_TITLE__</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
/* WorkspaceAlberta requirements board, template v1 (schema wa.tender_requirements.v1).
   Layout: a construction-sheet title block, then one working view (graph, timeline or checklist) beside a detail panel.
   Dark blueprint first; light is a whiteprint. Response-type colours match the requirement map. */
:root {
  --bg: #0a1624; --panel: #0f2033; --rule: #24425f; --rule-soft: #183049;
  --fg: #dbe7f3; --muted: #8aa3bf; --accent: #9fd0ff; --on-accent: #0a1624; --mark: #ffe08a; --late: #ff8a7a;
  --v-str: #a8e2b6; --v-num: #ffbf80; --v-bool: #cdb0ff;
  --t-narrative: #f2c14e; --t-attach_document: #5ec8e5; --t-pricing: #7bd389; --t-declaration: #ee6c9a;
  --t-compliance_confirm: #b794f6; --t-submission_instruction: #f08a4b; --t-form_field: #6f95ff;
  --t-security_bond: #ff5a5f; --t-experience_reference: #3fd9b8; --t-attendance: #f4f7fb; --t-other: #8aa3bf;
  --display: "Barlow Condensed", "Arial Narrow", "Roboto Condensed", sans-serif;
  --body: "IBM Plex Sans", "Segoe UI", system-ui, sans-serif;
  --mono: "IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace;
  color-scheme: dark;
}
@media (prefers-color-scheme: light) { :root:not([data-theme="dark"]) {
  --bg: #eef3f8; --panel: #ffffff; --rule: #b4c6da; --rule-soft: #dce6f0;
  --fg: #10243a; --muted: #4d6782; --accent: #1d5fa8; --on-accent: #ffffff; --mark: #8a5a00; --late: #b8322a;
  --v-str: #1f7a3a; --v-num: #a5520c; --v-bool: #6b3fc4;
  --t-narrative: #9a6a00; --t-attach_document: #0b7a99; --t-pricing: #2b7a3d; --t-declaration: #b02a5e;
  --t-compliance_confirm: #6b44b8; --t-submission_instruction: #b5531a; --t-form_field: #2f55c9;
  --t-security_bond: #c4262c; --t-experience_reference: #0f8a72; --t-attendance: #3a4a5c; --t-other: #5b6f8c;
  color-scheme: light; } }
:root[data-theme="light"] {
  --bg: #eef3f8; --panel: #ffffff; --rule: #b4c6da; --rule-soft: #dce6f0;
  --fg: #10243a; --muted: #4d6782; --accent: #1d5fa8; --on-accent: #ffffff; --mark: #8a5a00; --late: #b8322a;
  --v-str: #1f7a3a; --v-num: #a5520c; --v-bool: #6b3fc4;
  --t-narrative: #9a6a00; --t-attach_document: #0b7a99; --t-pricing: #2b7a3d; --t-declaration: #b02a5e;
  --t-compliance_confirm: #6b44b8; --t-submission_instruction: #b5531a; --t-form_field: #2f55c9;
  --t-security_bond: #c4262c; --t-experience_reference: #0f8a72; --t-attendance: #3a4a5c; --t-other: #5b6f8c;
  color-scheme: light; }

* { box-sizing: border-box; }
body { background: var(--bg); color: var(--fg); font: 13px/1.45 var(--body); }
button, input, select { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.app { max-width: 1480px; margin: 0 auto; padding-inline: 16px; padding-block: 16px 32px; display: grid; gap: 12px; }
.k { display: block; font: 500 9.5px/1.2 var(--mono); letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
.v { font: 500 13px/1.35 var(--mono); font-variant-numeric: tabular-nums; overflow-wrap: anywhere; }
h1 { font: 700 clamp(22px, 3vw, 30px)/1.02 var(--display); letter-spacing: .02em; text-transform: uppercase; margin: 2px 0 0; text-wrap: balance; }
h2 { font: 600 14px/1.1 var(--display); letter-spacing: .08em; text-transform: uppercase; margin: 0; }
a { color: var(--accent); }

/* Title block: drawn like the corner block of a construction sheet */
.tb { display: grid; grid-template-columns: minmax(0, 2.2fr) repeat(4, minmax(0, 1fr)); border: 1px solid var(--rule); background: var(--panel); }
.tb > div { padding: 8px 12px; border-left: 1px solid var(--rule); min-width: 0; }
.tb > div:first-child { border-left: 0; grid-row: span 2; padding: 12px; }
.tb > div:nth-child(n+6) { border-top: 1px solid var(--rule); }
.tb .big { font: 600 26px/1 var(--display); letter-spacing: .02em; font-variant-numeric: tabular-nums; }
.tb .late { color: var(--late); }
.sub { color: var(--muted); margin: 6px 0 0; font-size: 12px; }

/* Lead-time plan: three start-by blocks */
.plan { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px; }
.lead { border: 1px solid var(--rule); background: var(--panel); padding: 10px 12px; display: grid; gap: 4px; cursor: pointer; text-align: left; }
.lead:hover { border-color: var(--accent); }
.lead .row1 { display: flex; align-items: baseline; justify-content: space-between; gap: 8px; }
.lead .n { font: 600 28px/1 var(--display); font-variant-numeric: tabular-nums; }
.lead .when { font: 500 12px/1.3 var(--mono); }
.lead .when.behind { color: var(--late); }
.lead .lh { font: 600 14px/1.1 var(--display); letter-spacing: .08em; text-transform: uppercase; }
.lead .ln { color: var(--muted); font-size: 12px; }
.mix { display: flex; height: 5px; background: var(--rule-soft); }
.mix i { display: block; height: 100%; }

/* Toolbar */
.bar { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 16px; }
.seg { display: inline-flex; border: 1px solid var(--rule); }
.seg button { background: none; border: 0; padding: 7px 14px; font: 600 13px/1 var(--display); letter-spacing: .08em; text-transform: uppercase; color: var(--muted); cursor: pointer; }
.seg button[aria-pressed="true"] { background: var(--accent); color: var(--on-accent); }
.ctl { display: inline-flex; align-items: center; gap: 6px; color: var(--muted); font-size: 12px; }
.ctl select, .ctl input[type="search"] { background: var(--panel); border: 1px solid var(--rule); padding: 5px 8px; min-width: 0; }
.ctl input[type="search"] { width: 200px; max-width: 46vw; }
.ctl input[type="checkbox"] { accent-color: var(--accent); }

.main { display: grid; grid-template-columns: minmax(0, 1fr) 340px; gap: 12px; align-items: start; }
.view { border: 1px solid var(--rule); background: var(--panel); min-width: 0; }

/* Graph: node cards and edges, after JSON Crack */
.canvas { position: relative; height: clamp(440px, 72vh, 820px); overflow: hidden; cursor: grab; touch-action: none;
  background-color: var(--bg); background-image: radial-gradient(var(--rule) 1px, transparent 1.2px); background-size: 22px 22px; }
.canvas.drag { cursor: grabbing; }
.world { position: absolute; left: 0; top: 0; transform-origin: 0 0; }
.world svg { position: absolute; left: 0; top: 0; overflow: visible; }
.edge { fill: none; stroke: var(--rule); stroke-width: 1.4; }
.edge.on { stroke: var(--accent); stroke-width: 2; }
.node { position: absolute; background: var(--panel); border: 1px solid var(--rule); font: 12px/22px var(--mono); cursor: pointer; }
.node:hover { border-color: var(--muted); }
.node.sel { border-color: var(--accent); box-shadow: 0 0 0 1px var(--accent); }
.nh { height: 30px; display: flex; align-items: center; gap: 7px; padding: 0 10px; border-bottom: 1px solid var(--rule); white-space: nowrap; overflow: hidden; }
.nh b { font: 600 14px/1 var(--display); letter-spacing: .06em; text-transform: uppercase; }
.nh span { color: var(--muted); overflow: hidden; text-overflow: ellipsis; }
.nh em { margin-left: auto; font: 500 9px/1 var(--mono); font-style: normal; letter-spacing: .08em; padding: 3px 4px; background: var(--fg); color: var(--bg); }
.dot { width: 9px; height: 9px; border-radius: 50%; background: var(--c, var(--muted)); flex: none; }
.nr { display: flex; gap: 8px; padding: 0 10px; height: 22px; white-space: nowrap; overflow: hidden; width: 100%; background: none; border: 0; text-align: left; font: inherit; }
.nr:last-child { margin-bottom: 8px; }
.nk { color: var(--accent); flex: none; }
.nv { overflow: hidden; text-overflow: ellipsis; }
.s { color: var(--v-str); } .n { color: var(--v-num); } .b { color: var(--v-bool); } .z { color: var(--muted); }
button.nr { cursor: pointer; } button.nr:hover { background: var(--rule-soft); }
.nr .r { color: var(--muted); }
.zoom { position: absolute; right: 10px; bottom: 10px; display: flex; border: 1px solid var(--rule); background: var(--panel); z-index: 2; }
.zoom button { background: none; border: 0; border-left: 1px solid var(--rule); padding: 6px 10px; cursor: pointer; font: 12px var(--mono); }
.zoom button:first-child { border-left: 0; }
.hint { position: absolute; left: 10px; bottom: 10px; font: 11px var(--mono); color: var(--muted); background: var(--panel); padding: 4px 7px; border: 1px solid var(--rule); z-index: 2; }

/* Timeline */
.tl { overflow-x: auto; }
.tl svg { display: block; }
.tl text { fill: var(--fg); font: 11px var(--mono); }
.tl .mut { fill: var(--muted); }
.tl .hd { font: 600 13px var(--display); letter-spacing: .08em; text-transform: uppercase; }
.tl .row { cursor: pointer; }
.tl .row:hover .hit { fill: var(--rule-soft); }
.tl .row.sel .hit { fill: var(--rule-soft); }
.tl-note { padding: 10px 12px; margin: 0; border-top: 1px solid var(--rule); color: var(--muted); font-size: 12px; }

/* Checklist */
.cl { padding: 4px 12px 12px; }
.cl h3 { font: 600 13px/1.2 var(--display); letter-spacing: .08em; text-transform: uppercase; margin: 14px 0 6px; display: flex; gap: 10px; flex-wrap: wrap; align-items: baseline; }
.cl h3 small { font: 500 11px var(--mono); letter-spacing: 0; text-transform: none; color: var(--muted); }
.cl ul { list-style: none; margin: 0; padding: 0; display: grid; gap: 6px; }
.ci { display: grid; grid-template-columns: 76px minmax(0, 1fr); gap: 10px; padding: 8px; border: 1px solid var(--rule-soft); border-left: 3px solid var(--c, var(--rule)); }
.ci.sel { border-color: var(--accent); }
.ci.st-done .cbody { opacity: .55; }
.st { border: 1px solid var(--rule); background: none; padding: 4px 6px; font: 500 10.5px/1 var(--mono); letter-spacing: .06em; text-transform: uppercase; cursor: pointer; align-self: start; }
.st[data-v="doing"] { border-color: var(--mark); color: var(--mark); }
.st[data-v="done"] { background: var(--accent); border-color: var(--accent); color: var(--on-accent); }
.cbody { min-width: 0; cursor: pointer; }
.cbody p { margin: 2px 0; }
.meta { font: 11px/1.4 var(--mono); color: var(--muted); overflow-wrap: anywhere; }
.prog { display: flex; align-items: center; gap: 10px; padding: 12px 0 0; font: 12px var(--mono); color: var(--muted); }
.prog .track { flex: 1; height: 6px; background: var(--rule-soft); }
.prog .track i { display: block; height: 100%; background: var(--accent); }

/* Detail panel */
.detail { position: sticky; top: calc(env(safe-area-inset-top, 0px) + 12px); max-height: calc(100vh - 24px); overflow: auto; }
.sec { padding: 12px; }
.sec + .sec { border-top: 1px solid var(--rule); }
.dq { font-size: 15px; font-weight: 500; margin: 6px 0 8px; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chip { display: inline-flex; align-items: center; gap: 6px; font: 500 11px/1 var(--mono); padding: 4px 7px; border: 1px solid var(--rule); }
.mand { font: 500 10px/1 var(--mono); letter-spacing: .06em; background: var(--fg); color: var(--bg); padding: 3px 5px; }
.ev { margin: 8px 0 0; padding: 8px 10px; border-left: 2px solid var(--c, var(--rule)); background: var(--bg); font-size: 12.5px; }
.ev .meta { margin-bottom: 4px; }
.kv { display: grid; grid-template-columns: auto 1fr; gap: 3px 12px; margin: 8px 0 0; }
.kv dt { font: 11px var(--mono); color: var(--muted); } .kv dd { margin: 0; font: 12px var(--mono); overflow-wrap: anywhere; }
.btn { background: none; border: 1px solid var(--rule); padding: 5px 9px; cursor: pointer; font: 11px var(--mono); }
.btn:hover { border-color: var(--accent); }
.legend { display: grid; gap: 4px; margin-top: 8px; }
.legend div { display: grid; grid-template-columns: 10px 1fr auto; gap: 8px; align-items: center; font-size: 12px; }
.legend b { font: 12px var(--mono); color: var(--muted); font-weight: 400; font-variant-numeric: tabular-nums; }
.funnel { font: 12px/1.6 var(--mono); color: var(--muted); margin: 6px 0 0; }
.funnel strong { color: var(--fg); font-weight: 500; }
.warn { border: 1px solid var(--late); color: var(--fg); padding: 8px 12px; }
.warn strong { color: var(--late); }
pre.copy { white-space: pre-wrap; overflow-wrap: anywhere; font: 11px var(--mono); max-height: 200px; overflow: auto; background: var(--bg); padding: 8px; }

@media (max-width: 1060px) {
  .main { grid-template-columns: minmax(0, 1fr); }
  .detail { position: static; max-height: none; }
  .tb { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .tb > div:first-child { grid-column: 1 / -1; grid-row: auto; }
  .tb > div { border-top: 1px solid var(--rule); }
  .tb > div:nth-child(2n) { border-left: 0; }
  .tb > div:first-child { border-top: 0; }
}
@media (max-width: 640px) { .plan { grid-template-columns: minmax(0, 1fr); } .canvas { height: 62vh; } .hint { display: none; } }
@media (prefers-reduced-motion: no-preference) { .world.ease { transition: transform .25s ease; } }
</style>

<div class="app" id="app">
  <header class="tb" id="tb"></header>
  <div class="warn" id="warn" hidden></div>
  <section class="plan" id="plan" aria-label="Start-by plan"></section>
  <div class="bar">
    <div class="seg" role="group" aria-label="View">
      <button type="button" id="tab-graph" data-view="graph" aria-pressed="true">Graph</button>
      <button type="button" id="tab-timeline" data-view="timeline" aria-pressed="false">Timeline</button>
      <button type="button" id="tab-checklist" data-view="checklist" aria-pressed="false">Checklist</button>
    </div>
    <label class="ctl" id="groupctl">Group by
      <select id="group"><option value="lead">Lead time, then connector</option><option value="connector">Connector</option><option value="type">Response type</option></select>
    </label>
    <label class="ctl"><input type="checkbox" id="mand"> Mandatory only</label>
    <label class="ctl"><span>Find</span><input type="search" id="q" placeholder="R04, insurance, page 36"></label>
  </div>
  <div class="main">
    <div class="view" id="view">
      <div class="canvas" id="canvas"><div class="world" id="world"></div>
        <div class="hint">Drag to move · Ctrl + scroll or pinch to zoom</div>
        <div class="zoom"><button type="button" id="zin" aria-label="Zoom in">+</button><button type="button" id="zout" aria-label="Zoom out">−</button><button type="button" id="zfit">Fit</button></div>
      </div>
      <div id="timeline" hidden></div>
      <div id="checklist" hidden></div>
    </div>
    <aside class="view detail" id="detail" aria-live="polite"></aside>
  </div>
</div>

<script id="wa-data" type="application/json">__WA_TENDER_REQUIREMENTS_JSON__</script>
<script>
(() => {
const $ = (s) => document.querySelector(s);
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" })[c]);
let D = null;
try { D = JSON.parse($("#wa-data").textContent); } catch (e) { D = null; }
if (!D || !Array.isArray(D.requirements)) {
  $("#app").innerHTML = '<div class="warn"><strong>No requirement data.</strong> Put the classify_tender JSON (schema wa.tender_requirements.v1) in the wa-data script block.</div>';
  return;
}

// ---- vocabulary (from the WorkspaceAlberta tag library) ----
const TZ = "America/Edmonton";
const LEAD = [
  { k: "weeks", name: "Weeks", days: 21, note: "Needs a week or more: third-party documents, plans, quotes, approvals." },
  { k: "days", name: "Days", days: 7, note: "Needs work or a reply within a few days." },
  { k: "minutes", name: "Minutes", days: 2, note: "Can be answered from stored information or in a few minutes." },
];
const TYPES = {
  narrative: "Write a narrative", pricing: "Give prices", security_bond: "Bond or security",
  experience_reference: "Projects and references", attach_document: "Attach a document", compliance_confirm: "Confirm compliance",
  declaration: "Sign or declare", form_field: "Company fact", attendance: "Attend a meeting", submission_instruction: "Submission rule",
};
const SOURCES = { company_profile: "Company profile", document_on_file: "Document on file", person_input: "Person decides or writes",
  calculation: "Calculation", third_party: "Third party", calendar_action: "Calendar" };
const human = (s) => { s = String(s || "").replace(/_/g, " "); return s.charAt(0).toUpperCase() + s.slice(1); };
const typeOf = (q) => String(q.tag || "").split(".")[0];
const subOf = (q) => human(String(q.tag || "").split(".")[1] || q.tag);
const tcol = (q) => `var(--t-${TYPES[typeOf(q)] ? typeOf(q) : "other"})`;
const docs = Object.fromEntries((D.documents || []).map((d, i) => [d.doc ?? i, d.document]));
const pagesText = (q) => {
  const ps = q.pages || [], many = new Set(ps.map((p) => p.doc)).size > 1;
  const t = ps.map((p) => (many ? `${docs[p.doc] ?? "doc " + p.doc} ` : "") + p.page).join(", ");
  const more = (q.page_count || ps.length) - ps.length;
  return ps.length ? "p. " + t + (more > 0 ? ` (+${more} more)` : "") : "no page";
};

// ---- dates in Alberta time, counted in whole days ----
function local(date) {
  const p = Object.fromEntries(new Intl.DateTimeFormat("en-CA", { timeZone: TZ, year: "numeric", month: "2-digit", day: "2-digit", hour: "2-digit", minute: "2-digit", hourCycle: "h23" }).formatToParts(date).map((x) => [x.type, x.value]));
  return { day: Date.UTC(+p.year, +p.month - 1, +p.day) / 864e5, frac: (+p.hour * 60 + +p.minute) / 1440 };
}
const dayLabel = (d, o = { weekday: "short", month: "short", day: "numeric" }) => new Date(d * 864e5).toLocaleDateString("en-CA", { timeZone: "UTC", ...o });
const T = D.tender || {};
const closeDate = T.closes_at ? new Date(T.closes_at) : null;
const CL = closeDate && !isNaN(closeDate) ? local(closeDate) : null;
const closeTime = CL ? closeDate.toLocaleTimeString("en-CA", { timeZone: TZ, hour: "numeric", minute: "2-digit" }) : "";
const TODAY = local(new Date()).day;
const startBy = (lead) => CL ? CL.day - (LEAD.find((l) => l.k === lead) || LEAD[1]).days : null;
const DUE = CL ? CL.day - 1 : null;
const MS = (D.milestones || []).map((m) => {
  const s = String(m.date || "");
  if (/^\d{4}-\d{2}-\d{2}$/.test(s)) return { ...m, day: Date.UTC(+s.slice(0, 4), +s.slice(5, 7) - 1, +s.slice(8, 10)) / 864e5, time: "" };
  const d = new Date(s); if (isNaN(d)) return null;
  return { ...m, ...local(d), time: d.toLocaleTimeString("en-CA", { timeZone: TZ, hour: "numeric", minute: "2-digit" }) };
}).filter(Boolean);
function startText(lead) {
  const s = startBy(lead); if (s == null) return { t: "No closing time", behind: false };
  const gap = TODAY - s;
  if (CL && TODAY > CL.day) return { t: "Closed", behind: true };
  if (gap > 0) return { t: `Start by ${dayLabel(s)} · ${gap} day${gap > 1 ? "s" : ""} behind`, behind: true };
  if (gap === 0) return { t: `Start today, ${dayLabel(s)}`, behind: false };
  return { t: `Start by ${dayLabel(s)} · in ${-gap} day${gap < -1 ? "s" : ""}`, behind: false };
}

// ---- state ----
const KEY = "wa-board:" + (T.reference || D.reference || "tender");
let saved = {};
try { saved = JSON.parse(localStorage.getItem(KEY) || "{}") || {}; } catch (e) { saved = {}; }
const S = { view: "graph", group: saved.group || "lead", mand: false, q: "", sel: null, collapsed: new Set(), status: saved.status || {} };
const persist = () => { try { localStorage.setItem(KEY, JSON.stringify({ group: S.group, status: S.status })); } catch (e) {} };
const REQS = D.requirements;
const byId = Object.fromEntries(REQS.map((q) => [q.id, q]));
function visible() {
  const q = S.q.trim().toLowerCase();
  return REQS.filter((r) => (!S.mand || r.mandatory) && (!q || [r.id, r.tag, r.question, r.connector, pagesText(r), ...(r.evidence || []).map((e) => e.text)].join(" ").toLowerCase().includes(q.replace(/^page /, "p. ").replace(/^p\. ?/, "")) ));
}

// ---- header ----
function header() {
  const n = REQS.length, m = REQS.filter((q) => q.mandatory).length;
  const left = CL ? CL.day - TODAY : null;
  const title = T.title || D.reference || "Tender";
  const posting = /^https:\/\//.test(T.posting_url || "") ? `<a href="${esc(T.posting_url)}" target="_blank" rel="noopener">Official posting</a> · ` : "";
  $("#tb").innerHTML = `
    <div><span class="k">Bidder requirements · ${esc(T.reference || D.reference || "")}</span><h1>${esc(title)}</h1>
      <p class="sub">${posting}${esc(T.buyer || "Buyer not reported")}. Labels are classifier output: check them against the posting and every addendum.</p></div>
    <div><span class="k">Closes</span><span class="v">${CL ? esc(dayLabel(CL.day, { weekday: "short", month: "short", day: "numeric", year: "numeric" })) : "Not reported"}</span></div>
    <div><span class="k">Time</span><span class="v">${CL ? esc(closeTime) + " Alberta time" : esc(T.closing || "—")}</span></div>
    <div><span class="k">Days left</span><span class="big ${left != null && left < 7 ? "late" : ""}">${left == null ? "—" : left < 0 ? "Closed" : left}</span></div>
    <div><span class="k">Requirements</span><span class="big">${n}</span><span class="v"> · ${m} mandatory</span></div>
    <div><span class="k">Status</span><span class="v">${esc(D.status || "unknown")}</span></div>
    <div><span class="k">Source</span><span class="v">${esc(T.source || D.source || "—")}</span></div>

function renderTimeline() {
  const host = $("#timeline");
  if (!CL) { host.innerHTML = '<p class="tl-note">The result has no closing time (tender.closes_at), so there is nothing to count back from.</p>'; return; }
  const rs = visible();
  const d0 = Math.min(TODAY, CL.day - LEAD[0].days, ...MS.map((m) => m.day)) - 1, d1 = CL.day + 2, nd = d1 - d0;
  const LW = 250, Wd = Math.max(host.clientWidth || 900, 780), dw = (Wd - LW - 16) / nd, X = (d) => LW + (d - d0) * dw;
  const TOP = 78, RHT = 24, GH = 30;
  let y = TOP, rows = "";
  const ms = (q) => MS.find((m) => m.tag === q.tag) || (q.tag === "submission_instruction.closing_deadline" ? { day: CL.day, frac: CL.frac } : null);
  for (const L of LEAD) {
    const qs = rs.filter((q) => q.lead_time === L.k); if (!qs.length) continue;
    const st = startText(L.k), s = startBy(L.k);
    rows += `<text class="hd" x="8" y="${y + 19}">${L.name} · ${qs.length}</text><text x="${LW - 8}" y="${y + 19}" text-anchor="end" style="fill:var(${st.behind ? "--late" : "--muted"})">${esc(st.t.replace(/^Start by [^·]+· /, ""))}</text>`;
    y += GH;
    for (const q of qs) {
      const m = ms(q), col = tcol(q), cy = y + RHT / 2;
      let mark;
      if (m) { const mx = X(m.day + (m.frac ?? 0.5)); mark = `<path d="M${mx},${cy - 7} l7,7 l-7,7 l-7,-7z" style="fill:${col}"/>`; }
      else {
        const a = X(s), b = X(DUE + 1), t = Math.min(Math.max(X(TODAY), a), b);
        mark = (t > a ? `<rect x="${a}" y="${cy - 6}" width="${t - a}" height="12" fill="url(#hatch)" style="stroke:var(--late)" stroke-width="1"/>` : "") +
          `<rect x="${t}" y="${cy - 6}" width="${Math.max(0, b - t)}" height="12" style="fill:${q.mandatory ? col : "none"};stroke:${col}" stroke-width="1.5"/>`;
      }
      rows += `<g class="row ${S.sel === q.id ? "sel" : ""}" data-id="${esc(q.id)}"><rect class="hit" x="0" y="${y}" width="${Wd}" height="${RHT}" style="fill:transparent"/>
        <circle cx="14" cy="${cy}" r="4" style="fill:${q.mandatory ? col : "none"};stroke:${col}" stroke-width="1.5"/>
        <text x="26" y="${cy + 4}">${esc(q.id)}</text><text class="mut" x="62" y="${cy + 4}">${esc(subOf(q).slice(0, 26))}</text>${mark}</g>`;
      y += RHT;
    }
  }
  y += 8;
  rows += `<text class="hd" x="8" y="${y + 17}">Assemble and submit</text><rect x="${X(DUE)}" y="${y + 6}" width="${X(CL.day + CL.frac) - X(DUE)}" height="12" style="fill:var(--accent)"/>`;
  y += 32;
  let grid = "", ticks = "";
  for (let d = d0; d < d1; d++) {
    const wd = new Date(d * 864e5).getUTCDay();
    if (wd === 0 || wd === 6) grid += `<rect x="${X(d)}" y="${TOP - 8}" width="${dw}" height="${y - TOP + 8}" style="fill:var(--rule-soft)" opacity=".55"/>`;
    const lab = dw >= 24 || wd === 1;
    ticks += `<line x1="${X(d)}" x2="${X(d)}" y1="${TOP - 14}" y2="${TOP - 8}" style="stroke:var(--rule)"/>` +
      (lab ? `<text class="mut" x="${X(d) + 3}" y="${TOP - 18}">${dw >= 24 ? new Date(d * 864e5).getUTCDate() : esc(dayLabel(d, { month: "short", day: "numeric" }))}</text>` : "");
    if (dw >= 24 && (new Date(d * 864e5).getUTCDate() === 1 || d === d0)) ticks += `<text x="${X(d) + 3}" y="14">${esc(dayLabel(d, { month: "long" }))}</text>`;
  }
  const lines = [{ d: TODAY + 0.5, t: "Today", c: "--accent" }, ...MS.map((m) => ({ d: m.day + (m.frac ?? 0.5), t: m.label + (m.time ? " " + m.time : ""), c: "--mark" })),

  let lastX = -1e9, lvl = 0, marks = "";
  for (const l of lines) { const x = X(l.d); lvl = x - lastX < 120 ? (lvl + 1) % 2 : 0; lastX = x;
    marks += `<line x1="${x}" x2="${x}" y1="${TOP - 8}" y2="${y}" style="stroke:var(${l.c})" stroke-dasharray="${l.c === "--accent" ? "0" : "4 3"}"/>` +
      `<text x="${x > Wd - 150 ? x - 4 : x + 4}" y="${32 + lvl * 14}" text-anchor="${x > Wd - 150 ? "end" : "start"}" style="fill:var(${l.c})">${esc(l.t)}</text>`; }
  host.innerHTML = `<div class="tl"><svg width="${Wd}" height="${y + 6}" role="img" aria-label="Start-by timeline counted back from closing">
    <defs><pattern id="hatch" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="6" height="6" style="fill:transparent"/><line x1="0" y1="0" x2="0" y2="6" style="stroke:var(--late)" stroke-width="2"/></pattern></defs>
    ${grid}${ticks}${marks}${rows}</svg></div>
    <p class="tl-note">Bars run from the start-by date to the day before closing. Start-by is a planning rule, not a classifier output: ${LEAD.map((L) => `${L.name.toLowerCase()} ${L.days} days before closing`).join(", ")}. Hatched: days already behind plan. Diamonds: a dated event. Hollow: not mandatory.</p>`;
  host.querySelectorAll(".row").forEach((g) => g.addEventListener("click", () => select(g.dataset.id)));
}

  $("#copy").onclick = () => { const t = JSON.stringify(q, null, 2), b = $("#copy");
    const show = () => { const p = $("#copytext"); p.hidden = false; p.textContent = t; const r = document.createRange(); r.selectNodeContents(p); const sl = getSelection(); sl.removeAllRanges(); sl.addRange(r); b.textContent = "Select and copy the text below"; };
    try { navigator.clipboard.writeText(t).then(() => { b.textContent = "Copied"; }, show); } catch (e) { show(); } };
}

// ---- wiring ----
function render() { if (S.view === "graph") renderGraph(); if (S.view === "timeline") renderTimeline(); if (S.view === "checklist") renderChecklist(); renderDetail(); }
function select(id) {
  S.sel = id; render();
  if (id && S.view === "graph") focusNode(id);
  if (id && innerWidth <= 1060) $("#detail").scrollIntoView({ block: "nearest", behavior: matchMedia("(prefers-reduced-motion: reduce)").matches ? "auto" : "smooth" });
}
function setView(v) {
  S.view = v;
  document.querySelectorAll("[data-view]").forEach((b) => b.setAttribute("aria-pressed", String(b.dataset.view === v)));
  $("#canvas").hidden = v !== "graph"; $("#timeline").hidden = v !== "timeline"; $("#checklist").hidden = v !== "checklist"; $("#groupctl").hidden = v !== "graph";
  render();
}
document.querySelectorAll("[data-view]").forEach((b) => b.addEventListener("click", () => setView(b.dataset.view)));
$("#group").value = S.group;
$("#group").addEventListener("change", (e) => { S.group = e.target.value; persist(); V.ready = false; render(); });
$("#mand").addEventListener("change", (e) => { S.mand = e.target.checked; render(); });
$("#q").addEventListener("input", (e) => { S.q = e.target.value; render(); });
$("#plan").addEventListener("click", (e) => { const b = e.target.closest("[data-lead]"); if (!b) return;
  if (S.view === "graph" && S.group === "lead") { S.collapsed.delete("root"); S.collapsed.delete("lead:" + b.dataset.lead); renderGraph(); focusNode("lead:" + b.dataset.lead); }
  else if (S.view === "checklist") { const h = [...document.querySelectorAll(".cl h3")].find((x) => x.textContent.toLowerCase().startsWith(b.dataset.lead)); h && h.scrollIntoView({ block: "start" }); } });
addEventListener("resize", () => { if (S.view === "timeline") renderTimeline(); });
header();
const h0 = (location.hash || "").slice(1);
setView(["graph", "timeline", "checklist"].includes(h0) ? h0 : innerWidth < 640 ? "checklist" : "graph");
})();
</script>
